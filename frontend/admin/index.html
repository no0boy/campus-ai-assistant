<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>数据看板 - 校园AI助手后台</title>
  <link rel="stylesheet" href="../student/css/style.css">
  <style>
    .admin-layout { display: flex; min-height: 100vh; }

    /* 侧边导航 */
    .admin-nav {
      width: 220px;
      background: #1e293b;
      color: #e2e8f0;
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
    }
    .admin-nav .brand {
      padding: 20px;
      font-size: 17px;
      font-weight: 700;
      color: #fff;
      border-bottom: 1px solid #334155;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .nav-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 12px 20px;
      font-size: 14px;
      color: #94a3b8;
      text-decoration: none;
      transition: all 0.2s;
      border-left: 3px solid transparent;
    }
    .nav-item:hover { color: #fff; background: rgba(255,255,255,0.05); }
    .nav-item.active {
      color: #fff;
      background: rgba(37,99,235,0.15);
      border-left-color: #3b82f6;
    }

    /* 主区域 */
    .admin-main {
      flex: 1;
      background: #f8fafc;
      min-width: 0;
    }
    .admin-topbar {
      background: #fff;
      border-bottom: 1px solid #e2e8f0;
      padding: 0 24px;
      height: 56px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .admin-topbar h2 { font-size: 18px; color: #1e293b; }
    .admin-body { padding: 24px; }

    /* 统计卡片 */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 16px;
      margin-bottom: 24px;
    }
    .stat-card {
      background: #fff;
      border-radius: 12px;
      padding: 20px;
      border: 1px solid #e2e8f0;
    }
    .stat-card .label { font-size: 13px; color: #94a3b8; margin-bottom: 8px; }
    .stat-card .number { font-size: 32px; font-weight: 700; color: #1e293b; }
    .stat-card .change { font-size: 12px; margin-top: 4px; }
    .stat-card .change.up { color: #16a34a; }
    .stat-card .change.down { color: #dc2626; }

    /* 表格区域 */
    .section-card {
      background: #fff;
      border-radius: 12px;
      border: 1px solid #e2e8f0;
      margin-bottom: 20px;
    }
    .section-header {
      padding: 16px 20px;
      border-bottom: 1px solid #e2e8f0;
      font-size: 15px;
      font-weight: 600;
      color: #1e293b;
    }
    .section-body { padding: 16px 20px; }

    table { width: 100%; border-collapse: collapse; }
    th, td { text-align: left; padding: 10px 12px; font-size: 13px; }
    th { color: #94a3b8; font-weight: 500; border-bottom: 1px solid #e2e8f0; }
    td { color: #334155; border-bottom: 1px solid #f1f5f9; }
    tr:hover td { background: #f8fafc; }

    .tag {
      display: inline-block;
      padding: 2px 10px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: 500;
    }
    .tag-blue { background: #eff6ff; color: #2563eb; }
    .tag-green { background: #f0fdf4; color: #16a34a; }
    .tag-yellow { background: #fefce8; color: #ca8a04; }
    .tag-red { background: #fef2f2; color: #dc2626; }

    /* 响应式 */
    @media (max-width: 768px) {
      .admin-nav { width: 60px; }
      .admin-nav .brand span, .nav-item span { display: none; }
      .stats-grid { grid-template-columns: repeat(2, 1fr); }
    }
  </style>
</head>
<body>

<div class="admin-layout">

  <!-- ==================== 侧边导航 ==================== -->
  <nav class="admin-nav">
    <div class="brand">🤖 <span>AI助手后台</span></div>
    <a class="nav-item active" href="index.html">
      📊 <span>数据看板</span>
    </a>
    <a class="nav-item" href="documents.html">
      📁 <span>知识库管理</span>
    </a>
    <a class="nav-item" href="settings.html">
      ⚙️ <span>模型配置</span>
    </a>
    <div style="margin-top:auto;padding:12px 20px;border-top:1px solid #334155;">
      <a class="nav-item" href="../student/index.html" style="padding:8px 0;">
        ← <span>返回学生端</span>
      </a>
      <a class="nav-item" href="#" onclick="logout()" style="padding:8px 0;color:#f87171;">
        🚪 <span>退出登录</span>
      </a>
    </div>
  </nav>

  <!-- ==================== 主区域 ==================== -->
  <main class="admin-main">
    <div class="admin-topbar">
      <h2>📊 数据看板</h2>
      <span style="font-size:13px;color:#94a3b8;" id="currentTime"></span>
    </div>

    <div class="admin-body">

      <!-- 统计卡片 -->
      <div class="stats-grid">
        <div class="stat-card">
          <div class="label">📝 总提问量</div>
          <div class="number" id="totalQuestions">0</div>
          <div class="change up">↑ 今日 +0</div>
        </div>
        <div class="stat-card">
          <div class="label">👥 活跃用户</div>
          <div class="number" id="activeUsers">0</div>
          <div class="change up">本周</div>
        </div>
        <div class="stat-card">
          <div class="label">📁 知识库文档</div>
          <div class="number" id="docCount">0</div>
          <div class="change">个文档</div>
        </div>
        <div class="stat-card">
          <div class="label">👍 好评率</div>
          <div class="number" id="goodRate">-</div>
          <div class="change up">基于反馈</div>
        </div>
      </div>

      <!-- 热门问题排行 -->
      <div class="section-card">
        <div class="section-header">🔥 热门问题 Top 10</div>
        <div class="section-body">
          <table>
            <thead>
              <tr><th>#</th><th>问题</th><th>提问次数</th><th>好评</th></tr>
            </thead>
            <tbody id="hotQuestions">
              <tr><td colspan="4" style="text-align:center;color:#94a3b8;padding:20px;">
                暂无数据，启动后端后自动加载
              </td></tr>
            </tbody>
          </table>
        </div>
      </div>

      <!-- 最近提问 -->
      <div class="section-card">
        <div class="section-header">🕐 最近提问记录</div>
        <div class="section-body">
          <table>
            <thead>
              <tr><th>用户</th><th>问题</th><th>时间</th><th>状态</th></tr>
            </thead>
            <tbody id="recentQuestions">
              <tr><td colspan="4" style="text-align:center;color:#94a3b8;padding:20px;">
                暂无数据
              </td></tr>
            </tbody>
          </table>
        </div>
      </div>

    </div>
  </main>
</div>

<script src="../student/js/api.js"></script>
<script>
  // ========== 登录检查 ==========
  if (!localStorage.getItem('token')) {
    window.location.href = 'login.html'
  }

  // 显示当前时间
  function updateTime() {
    document.getElementById('currentTime').textContent = new Date().toLocaleString('zh-CN')
  }
  updateTime()
  setInterval(updateTime, 10000)

  // ========== 加载数据 ==========
  async function loadDashboard() {
    try {
      // 调用后端统计接口
      const res = await fetch('http://127.0.0.1:8001/api/stats/overview', {
        headers: { Authorization: `Bearer ${localStorage.getItem('token')}` }
      })
      const data = await res.json()

      if (data.code === 0) {
        document.getElementById('totalQuestions').textContent = data.data.total_questions || 0
        document.getElementById('activeUsers').textContent = data.data.active_users || 0
        document.getElementById('docCount').textContent = data.data.doc_count || 0
        document.getElementById('goodRate').textContent = (data.data.good_rate || 0) + '%'
      }
    } catch (e) {
      // 后端没启动时用占位数据
      console.log('后端未连接，显示占位数据')
      document.getElementById('totalQuestions').textContent = '--'
      document.getElementById('activeUsers').textContent = '--'
      document.getElementById('docCount').textContent = '--'
      document.getElementById('goodRate').textContent = '--'
    }
  }

  loadDashboard()

  function logout() {
    localStorage.removeItem('token')
    localStorage.removeItem('user')
    window.location.href = 'login.html'
  }
</script>
</body>
</html>
