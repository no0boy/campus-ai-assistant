<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>运营分析看板 - 校园AI知识平台后台</title>
  <link rel="stylesheet" href="../student/css/style.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <style>
    .admin-layout { display: flex; min-height: 100vh; }

    /* 侧边导航 */
    .admin-nav {
      width: 220px; background: #1e293b; color: #e2e8f0;
      display: flex; flex-direction: column; flex-shrink: 0;
    }
    .admin-nav .brand {
      padding: 20px; font-size: 17px; font-weight: 700; color: #fff;
      border-bottom: 1px solid #334155; display: flex; align-items: center; gap: 8px;
    }
    .nav-item {
      display: flex; align-items: center; gap: 10px;
      padding: 12px 20px; font-size: 14px; color: #94a3b8;
      text-decoration: none; transition: all 0.2s;
      border-left: 3px solid transparent;
    }
    .nav-item:hover { color: #fff; background: rgba(255,255,255,0.05); }
    .nav-item.active { color: #fff; background: rgba(37,99,235,0.15); border-left-color: #3b82f6; }

    /* 主区域 */
    .admin-main { flex: 1; background: #f8fafc; min-width: 0; }
    .admin-topbar {
      background: #fff; border-bottom: 1px solid #e2e8f0;
      padding: 0 24px; height: 56px; display: flex; align-items: center; justify-content: space-between;
    }
    .admin-topbar h2 { font-size: 18px; color: #1e293b; }
    .admin-body { padding: 20px 24px; }

    /* 概览卡片行 */
    .overview-grid {
      display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; margin-bottom: 20px;
    }
    .ov-card {
      background: #fff; border-radius: 12px; padding: 18px 20px;
      border: 1px solid #e2e8f0; display: flex; align-items: center; gap: 14px;
    }
    .ov-icon {
      width: 44px; height: 44px; border-radius: 10px;
      display: flex; align-items: center; justify-content: center; font-size: 20px; flex-shrink: 0;
    }
    .ov-icon.blue { background: #eff6ff; }
    .ov-icon.green { background: #f0fdf4; }
    .ov-icon.amber { background: #fefce8; }
    .ov-icon.purple { background: #f5f3ff; }
    .ov-icon.red { background: #fef2f2; }
    .ov-icon.cyan { background: #ecfeff; }
    .ov-info .ov-label { font-size: 12px; color: #94a3b8; margin-bottom: 2px; }
    .ov-info .ov-value { font-size: 22px; font-weight: 700; color: #1e293b; line-height: 1.1; }
    .ov-info .ov-sub { font-size: 11px; color: #94a3b8; margin-top: 2px; }

    /* 图表区域 */
    .chart-row {
      display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 20px;
    }
    .chart-card {
      background: #fff; border-radius: 12px; border: 1px solid #e2e8f0; overflow: hidden;
    }
    .chart-header {
      padding: 14px 18px; border-bottom: 1px solid #e2e8f0;
      font-size: 14px; font-weight: 600; color: #1e293b; display: flex; align-items: center; gap: 6px;
    }
    .chart-body { padding: 14px 18px; }
    .chart-body canvas { width: 100% !important; height: 240px !important; }

    /* 下方区域：3 列 */
    .bottom-row {
      display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 16px; margin-bottom: 20px;
    }
    .info-card {
      background: #fff; border-radius: 12px; border: 1px solid #e2e8f0; overflow: hidden;
    }
    .info-header {
      padding: 14px 18px; border-bottom: 1px solid #e2e8f0;
      font-size: 14px; font-weight: 600; color: #1e293b;
    }
    .info-body { padding: 10px 0; }

    /* 热门问题表格 */
    .hot-table { width: 100%; border-collapse: collapse; }
    .hot-table th, .hot-table td { text-align: left; padding: 8px 16px; font-size: 12px; }
    .hot-table th { color: #94a3b8; font-weight: 500; border-bottom: 1px solid #e2e8f0; padding-bottom: 10px; }
    .hot-table td { color: #334155; border-bottom: 1px solid #f1f5f9; }
    .hot-table tr:hover td { background: #f8fafc; }

    /* RAG 统计 */
    .rag-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; padding: 10px 16px; }
    .rag-item { text-align: center; padding: 10px 0; }
    .rag-item .rag-val { font-size: 26px; font-weight: 700; }
    .rag-item .rag-label { font-size: 11px; color: #94a3b8; margin-top: 2px; }
    .rag-val.green { color: #16a34a; }
    .rag-val.blue { color: #2563eb; }
    .rag-val.amber { color: #ca8a04; }

    /* 模型列表 */
    .model-list { padding: 0; margin: 0; list-style: none; }
    .model-list li {
      display: flex; align-items: center; justify-content: space-between;
      padding: 10px 16px; border-bottom: 1px solid #f1f5f9; font-size: 13px;
    }
    .model-list li:hover { background: #f8fafc; }
    .model-bar-wrap { flex: 1; margin: 0 10px; height: 6px; background: #f1f5f9; border-radius: 3px; overflow: hidden; }
    .model-bar-fill { height: 100%; border-radius: 3px; background: #3b82f6; }

    .tag {
      display: inline-block; padding: 2px 10px; border-radius: 20px; font-size: 11px; font-weight: 500;
    }
    .tag-blue { background: #eff6ff; color: #2563eb; }
    .tag-green { background: #f0fdf4; color: #16a34a; }
    .tag-amber { background: #fefce8; color: #ca8a04; }

    /* 加载/错误 */
    .loading-msg { text-align: center; padding: 40px; color: #94a3b8; font-size: 14px; }
    .error-msg { text-align: center; padding: 40px; color: #dc2626; font-size: 14px; }

    /* 响应式 */
    @media (max-width: 1024px) {
      .overview-grid { grid-template-columns: repeat(3, 1fr); }
      .chart-row { grid-template-columns: 1fr; }
      .bottom-row { grid-template-columns: 1fr; }
    }
    @media (max-width: 768px) {
      .admin-nav { width: 60px; }
      .admin-nav .brand span, .nav-item span { display: none; }
      .overview-grid { grid-template-columns: repeat(2, 1fr); }
      .admin-body { padding: 12px; }
    }
  </style>
</head>
<body>

<div class="admin-layout">

  <!-- ==================== 侧边导航 ==================== -->
  <nav class="admin-nav">
    <div class="brand">🤖 <span>AI助手后台</span></div>
    <a class="nav-item active" href="index.html">📊 <span>运营看板</span></a>
    <a class="nav-item" href="documents.html">📁 <span>知识库管理</span></a>
    <a class="nav-item" href="settings.html">⚙️ <span>模型配置</span></a>
    <div style="margin-top:auto;padding:12px 20px;border-top:1px solid #334155;">
      <a class="nav-item" href="../student/index.html" style="padding:8px 0;">← <span>返回学生端</span></a>
      <a class="nav-item" href="#" onclick="logout()" style="padding:8px 0;color:#f87171;">🚪 <span>退出登录</span></a>
    </div>
  </nav>

  <!-- ==================== 主区域 ==================== -->
  <main class="admin-main">
    <div class="admin-topbar">
      <h2>📊 AI 运营分析看板</h2>
      <span style="font-size:13px;color:#94a3b8;" id="currentTime"></span>
    </div>

    <div class="admin-body">

      <!-- 概览卡片 -->
      <div class="overview-grid" id="overviewCards">
        <div class="loading-msg" style="grid-column:1/-1;">加载中...</div>
      </div>

      <!-- 图表行 -->
      <div class="chart-row">
        <div class="chart-card">
          <div class="chart-header">📈 Token 消耗趋势（7天）</div>
          <div class="chart-body"><canvas id="tokenChart"></canvas></div>
        </div>
        <div class="chart-card">
          <div class="chart-header">⏱ 响应时间趋势（7天）</div>
          <div class="chart-body"><canvas id="respChart"></canvas></div>
        </div>
      </div>

      <!-- 图表行二 -->
      <div class="chart-row">
        <div class="chart-card">
          <div class="chart-header">🥧 模型使用分布</div>
          <div class="chart-body"><canvas id="modelChart"></canvas></div>
        </div>
        <div class="chart-card">
          <div class="chart-header">💰 模型平均 Token 消耗对比</div>
          <div class="chart-body"><canvas id="tokenPerModelChart"></canvas></div>
        </div>
      </div>

      <!-- 下方三列 -->
      <div class="bottom-row">
        <!-- 热门问题 -->
        <div class="info-card">
          <div class="info-header">🔥 热门问题 Top 8</div>
          <div class="info-body">
            <table class="hot-table" id="hotTable">
              <thead><tr><th>#</th><th>问题</th><th>次数</th></tr></thead>
              <tbody><tr><td colspan="3" class="loading-msg">加载中...</td></tr></tbody>
            </table>
          </div>
        </div>
        <!-- RAG 效果 -->
        <div class="info-card">
          <div class="info-header">🎯 RAG 效果概览</div>
          <div class="rag-grid" id="ragStats">
            <div class="loading-msg" style="grid-column:1/-1;">加载中...</div>
          </div>
        </div>
        <!-- 模型详情 -->
        <div class="info-card">
          <div class="info-header">🔧 模型调用排行</div>
          <ul class="model-list" id="modelList">
            <li class="loading-msg">加载中...</li>
          </ul>
        </div>
      </div>

    </div>
  </main>
</div>

<!-- ==================== 脚本 ==================== -->
<script src="../student/js/api.js?v=3"></script>
<script>
  // ========== 登录检查 ==========
  if (!localStorage.getItem('token')) { window.location.href = 'login.html'; }

  // ========== 时钟 ==========
  function updateTime() { document.getElementById('currentTime').textContent = new Date().toLocaleString('zh-CN'); }
  updateTime(); setInterval(updateTime, 10000);

  // ========== 图表实例 ==========
  let charts = {};

  function destroyCharts() {
    Object.values(charts).forEach(c => c.destroy());
    charts = {};
  }

  // ========== 颜色调色板 ==========
  const COLORS = ['#3b82f6','#10b981','#f59e0b','#ef4444','#8b5cf6','#ec4899','#06b6d4','#84cc16'];
  const BG_COLORS = COLORS.map(c => c + '20');

  // ========== 加载数据 ==========
  async function loadDashboard() {
    try {
      const token = localStorage.getItem('token');
      const res = await fetch(BASE_URL + '/api/stats/dashboard', {
        headers: { Authorization: `Bearer ${token}` }
      });

      if (res.status === 401) { window.location.href = 'login.html'; return; }
      const result = await res.json();
      if (result.code !== 0) throw new Error(result.message || 'API error');

      const d = result.data;
      renderOverview(d.overview);
      renderTokenChart(d.cost.trend);
      renderRespChart(d.performance.trend);
      renderModelChart(d.models);
      renderTokenPerModelChart(d.models);
      renderHotTable(d.hot_questions);
      renderRagStats(d.rag);
      renderModelList(d.models);

    } catch (e) {
      console.error('加载看板失败:', e);
      document.querySelectorAll('.loading-msg').forEach(el => {
        el.className = 'error-msg'; el.textContent = '后端未连接，请先启动服务';
      });
    }
  }

  // ========== 概览卡片 ==========
  function renderOverview(ov) {
    const cards = [
      { icon: '📝', cls: 'blue',   val: ov.today_questions,  label: '今日提问', sub: '累计 ' + ov.total_questions },
      { icon: '💰', cls: 'amber',  val: ov.today_tokens.toLocaleString(), label: '今日 Token', sub: '累计 ' + ov.total_tokens.toLocaleString() },
      { icon: '👥', cls: 'green',  val: ov.active_users,     label: '活跃用户(30天)', sub: '' },
      { icon: '👍', cls: 'purple', val: ov.satisfaction_rate + '%', label: '用户满意率', sub: '' },
      { icon: '⚡', cls: 'cyan',   val: ov.avg_response_ms + 'ms', label: '平均响应', sub: '' },
      { icon: '💾', cls: 'red',    val: ov.cache_hit_rate + '%', label: '缓存命中率', sub: '' },
    ];
    document.getElementById('overviewCards').innerHTML = cards.map(c => `
      <div class="ov-card">
        <div class="ov-icon ${c.cls}">${c.icon}</div>
        <div class="ov-info">
          <div class="ov-label">${c.label}</div>
          <div class="ov-value">${c.val}</div>
          ${c.sub ? '<div class="ov-sub">' + c.sub + '</div>' : ''}
        </div>
      </div>
    `).join('');
  }

  // ========== Token 趋势图 ==========
  function renderTokenChart(trend) {
    if (!trend || trend.length === 0) return;
    const ctx = document.getElementById('tokenChart').getContext('2d');
    charts.token = new Chart(ctx, {
      type: 'line',
      data: {
        labels: trend.map(t => t.day.slice(5)),
        datasets: [{
          label: 'Token 消耗', data: trend.map(t => t.tokens),
          borderColor: '#3b82f6', backgroundColor: 'rgba(59,130,246,0.08)',
          fill: true, tension: 0.3, pointRadius: 4, pointHoverRadius: 6,
          yAxisID: 'y',
        }, {
          label: '成本(元)', data: trend.map(t => t.cost),
          borderColor: '#f59e0b', backgroundColor: 'transparent',
          borderDash: [5,5], tension: 0.3, pointRadius: 4, pointHoverRadius: 6,
          yAxisID: 'y1',
        }]
      },
      options: {
        responsive: true, maintainAspectRatio: false,
        interaction: { intersect: false, mode: 'index' },
        plugins: { legend: { position: 'bottom', labels: { boxWidth: 12, padding: 20, font: { size: 11 } } } },
        scales: {
          y: { type: 'linear', position: 'left', title: { display: true, text: 'Token' }, ticks: { font: { size: 10 } }, grid: { color: '#f1f5f9' } },
          y1: { type: 'linear', position: 'right', title: { display: true, text: '元' }, ticks: { font: { size: 10 } }, grid: { display: false } },
          x: { ticks: { font: { size: 10 } }, grid: { display: false } }
        }
      }
    });
  }

  // ========== 响应时间趋势 ==========
  function renderRespChart(trend) {
    if (!trend || trend.length === 0) return;
    const ctx = document.getElementById('respChart').getContext('2d');
    charts.resp = new Chart(ctx, {
      type: 'line',
      data: {
        labels: trend.map(t => t.day.slice(5)),
        datasets: [{
          label: '平均响应(ms)', data: trend.map(t => t.avg_ms),
          borderColor: '#10b981', backgroundColor: 'rgba(16,185,129,0.08)',
          fill: true, tension: 0.3, pointRadius: 4, pointHoverRadius: 6,
        }, {
          label: '调用次数', data: trend.map(t => t.calls),
          borderColor: '#8b5cf6', backgroundColor: 'transparent',
          borderDash: [5,5], tension: 0.3, pointRadius: 4, pointHoverRadius: 6,
          yAxisID: 'y1',
        }]
      },
      options: {
        responsive: true, maintainAspectRatio: false,
        interaction: { intersect: false, mode: 'index' },
        plugins: { legend: { position: 'bottom', labels: { boxWidth: 12, padding: 20, font: { size: 11 } } } },
        scales: {
          y: { title: { display: true, text: 'ms' }, ticks: { font: { size: 10 } }, grid: { color: '#f1f5f9' } },
          y1: { position: 'right', title: { display: true, text: '次' }, ticks: { font: { size: 10 } }, grid: { display: false } },
          x: { ticks: { font: { size: 10 } }, grid: { display: false } }
        }
      }
    });
  }

  // ========== 模型分布饼图 ==========
  function renderModelChart(models) {
    if (!models || models.length === 0) return;
    const ctx = document.getElementById('modelChart').getContext('2d');
    charts.model = new Chart(ctx, {
      type: 'doughnut',
      data: {
        labels: models.map(m => m.name),
        datasets: [{ data: models.map(m => m.calls), backgroundColor: COLORS, borderWidth: 0 }]
      },
      options: {
        responsive: true, maintainAspectRatio: false,
        plugins: {
          legend: { position: 'bottom', labels: { boxWidth: 10, padding: 14, font: { size: 11 }, usePointStyle: true } },
          tooltip: { callbacks: { label: ctx => ctx.label + ': ' + ctx.parsed + ' 次 (' + models[ctx.dataIndex].ratio + '%)' } }
        }
      }
    });
  }

  // ========== 模型 Token 消耗对比 ==========
  function renderTokenPerModelChart(models) {
    if (!models || models.length === 0) return;
    const ctx = document.getElementById('tokenPerModelChart').getContext('2d');
    charts.tpm = new Chart(ctx, {
      type: 'bar',
      data: {
        labels: models.map(m => m.name),
        datasets: [{
          label: '平均 Token', data: models.map(m => m.avg_tokens),
          backgroundColor: COLORS.slice(0, models.length),
          borderRadius: 6,
        }]
      },
      options: {
        indexAxis: 'y',
        responsive: true, maintainAspectRatio: false,
        plugins: { legend: { display: false } },
        scales: {
          x: { title: { display: true, text: 'Token' }, ticks: { font: { size: 10 } }, grid: { color: '#f1f5f9' } },
          y: { ticks: { font: { size: 10 } }, grid: { display: false } }
        }
      }
    });
  }

  // ========== 热门问题表格 ==========
  function renderHotTable(questions) {
    const tbody = document.querySelector('#hotTable tbody');
    if (!questions || questions.length === 0) {
      tbody.innerHTML = '<tr><td colspan="3" style="text-align:center;color:#94a3b8;padding:20px;">暂无数据</td></tr>';
      return;
    }
    tbody.innerHTML = questions.map((q, i) => `
      <tr>
        <td style="font-weight:600;color:#94a3b8;">${i + 1}</td>
        <td title="${q.question}">${q.question}</td>
        <td><span class="tag tag-blue">${q.count}次</span></td>
      </tr>
    `).join('');
  }

  // ========== RAG 效果 ==========
  function renderRagStats(rag) {
    document.getElementById('ragStats').innerHTML = `
      <div class="rag-item"><div class="rag-val green">${rag.hit_rate}%</div><div class="rag-label">知识库命中率</div></div>
      <div class="rag-item"><div class="rag-val amber">${rag.fallback_rate}%</div><div class="rag-label">大模型兜底率</div></div>
      <div class="rag-item"><div class="rag-val blue">${rag.vector_rate}%</div><div class="rag-label">向量检索占比</div></div>
      <div class="rag-item"><div class="rag-val">${rag.avg_sources}</div><div class="rag-label">平均参考来源数</div></div>
      <div class="rag-item" style="grid-column:1/-1;"><div class="rag-label" style="margin-top:4px;">总RAG调用: ${rag.total_rag_calls} 次</div></div>
    `;
  }

  // ========== 模型排行列表 ==========
  function renderModelList(models) {
    const el = document.getElementById('modelList');
    if (!models || models.length === 0) {
      el.innerHTML = '<li style="text-align:center;color:#94a3b8;padding:20px;">暂无数据</li>';
      return;
    }
    const maxCalls = Math.max(...models.map(m => m.calls));
    el.innerHTML = models.map((m, i) => `
      <li>
        <span style="color:${COLORS[i]};font-weight:600;">${m.name}</span>
        <div class="model-bar-wrap"><div class="model-bar-fill" style="width:${(m.calls/maxCalls*100)}%;background:${COLORS[i]};"></div></div>
        <span style="font-size:11px;color:#94a3b8;">${m.calls}次 ${m.avg_time_ms}ms</span>
      </li>
    `).join('');
  }

  // ========== 退出登录 ==========
  function logout() {
    localStorage.removeItem('token'); localStorage.removeItem('user');
    window.location.href = 'login.html';
  }

  // ========== 启动 ==========
  loadDashboard();
  // 每 60 秒自动刷新
  setInterval(() => { destroyCharts(); loadDashboard(); }, 60000);
</script>
</body>
</html>
