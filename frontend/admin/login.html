<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>管理员登录 - 校园AI助手</title>
  <link rel="stylesheet" href="../student/css/style.css">
  <style>
    .login-wrapper {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
      padding: 20px;
    }
    .login-card {
      width: 100%;
      max-width: 400px;
      background: #fff;
      border-radius: 16px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
      padding: 40px 32px;
    }
    .login-header {
      text-align: center;
      margin-bottom: 32px;
    }
    .login-header .icon {
      width: 56px; height: 56px;
      background: linear-gradient(135deg, #2563eb, #7c3aed);
      border-radius: 12px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 28px;
      margin-bottom: 12px;
    }
    .login-header h1 { font-size: 22px; color: #1e293b; margin-bottom: 4px; }
    .login-header p  { font-size: 13px; color: #94a3b8; }
    .form-group { margin-bottom: 18px; }
    .form-group label { display:block; font-size:13px; font-weight:500; color:#334155; margin-bottom:6px; }
    .error-msg {
      background: #fef2f2; color: #dc2626; padding: 10px 14px;
      border-radius: 6px; font-size: 13px; margin-bottom: 16px; display: none;
    }
    .login-btn { width: 100%; padding: 12px; font-size: 15px; margin-top: 4px; }
    .back-link { text-align: center; margin-top: 16px; font-size: 13px; }
  </style>
</head>
<body>

<div class="login-wrapper">
  <div class="login-card">
    <div class="login-header">
      <div class="icon">⚙️</div>
      <h1>管理员登录</h1>
      <p>校园 AI 助手 · 后台管理系统</p>
    </div>

    <div class="error-msg" id="errorMsg"></div>

    <form id="loginForm">
      <div class="form-group">
        <label>管理员账号</label>
        <input type="text" class="input" id="username"
               placeholder="请输入管理员账号" required autocomplete="username">
      </div>
      <div class="form-group">
        <label>密码</label>
        <input type="password" class="input" id="password"
               placeholder="请输入密码" required autocomplete="current-password">
      </div>
      <button type="submit" class="btn btn-primary login-btn" id="submitBtn">登 录</button>
    </form>

    <div class="back-link">
      <a href="../student/index.html">← 返回学生端</a>
    </div>
  </div>
</div>

<script src="../student/js/api-v3.js"></script>
<script>
  const form = document.getElementById('loginForm')
  const errorMsg = document.getElementById('errorMsg')
  const submitBtn = document.getElementById('submitBtn')

  form.addEventListener('submit', async (e) => {
    e.preventDefault()

    const username = document.getElementById('username').value.trim()
    const password = document.getElementById('password').value.trim()

    if (!username || !password) {
      showError('请填写账号和密码')
      return
    }

    submitBtn.disabled = true
    submitBtn.textContent = '登录中...'
    errorMsg.style.display = 'none'

    try {
      // 管理员登录用同一个接口，后端根据 role 判断
      const res = await apiLogin(username, password)

      if (res.code === 0) {
        localStorage.setItem('token', res.data.token)
        localStorage.setItem('user', JSON.stringify(res.data.user))
        window.location.href = 'index.html'
      } else {
        showError(res.message || '登录失败')
      }
    } catch (err) {
      showError('网络异常，请检查后端服务')
    } finally {
      submitBtn.disabled = false
      submitBtn.textContent = '登 录'
    }
  })

  function showError(msg) {
    errorMsg.textContent = msg
    errorMsg.style.display = 'block'
  }
</script>
</body>
</html>
