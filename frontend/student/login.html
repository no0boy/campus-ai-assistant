<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>登录 - 校园AI助手</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    /* ===== 登录页专属样式 ===== */
    .login-wrapper {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background: var(--bg-secondary);
      padding: 20px;
    }

    .login-card {
      width: 100%;
      max-width: 420px;
      background: var(--bg);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-lg);
      padding: 40px 32px;
      border: 1px solid var(--border);
    }

    .login-header {
      text-align: center;
      margin-bottom: 32px;
    }

    .login-logo {
      width: 64px;
      height: 64px;
      background: linear-gradient(135deg, var(--primary), #7c3aed);
      border-radius: var(--radius-md);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 32px;
      margin-bottom: 16px;
    }

    .login-header h1 {
      font-size: 24px;
      font-weight: 700;
      color: var(--text);
      margin-bottom: 6px;
    }

    .login-header p {
      font-size: 14px;
      color: var(--text-secondary);
    }

    .form-group {
      margin-bottom: 20px;
    }

    .form-group label {
      display: block;
      font-size: 13px;
      font-weight: 500;
      color: var(--text);
      margin-bottom: 6px;
    }

    .input-icon {
      position: relative;
    }
    .input-icon .icon {
      position: absolute;
      left: 12px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 18px;
      color: var(--text-light);
    }
    .input-icon input {
      padding-left: 40px;
    }

    .login-btn {
      width: 100%;
      padding: 12px;
      font-size: 16px;
      margin-top: 8px;
    }

    .login-footer {
      text-align: center;
      margin-top: 20px;
      font-size: 13px;
      color: var(--text-secondary);
    }

    .error-msg {
      background: #fef2f2;
      color: #dc2626;
      padding: 10px 14px;
      border-radius: var(--radius-sm);
      font-size: 13px;
      margin-bottom: 16px;
      display: none;
    }

    /* 暗色适配 */
    [data-theme="dark"] .error-msg {
      background: #450a0a;
      color: #fca5a5;
    }

    .theme-toggle {
      position: fixed;
      top: 20px;
      right: 20px;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      border: 1px solid var(--border);
      background: var(--bg);
      cursor: pointer;
      font-size: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all var(--transition);
    }
    .theme-toggle:hover {
      background: var(--bg-hover);
    }

    /* 移动端适配 */
    @media (max-width: 480px) {
      .login-card {
        padding: 28px 20px;
        box-shadow: none;
        border: none;
      }
      .login-wrapper {
        background: var(--bg);
        padding: 0;
      }
    }
  </style>
</head>
<body>

  <!-- 主题切换按钮 -->
  <button class="theme-toggle" onclick="toggleTheme()" title="切换主题" id="themeBtn">🌙</button>

  <div class="login-wrapper">
    <div class="login-card">
      <!-- 头部 -->
      <div class="login-header">
        <div class="login-logo">🤖</div>
        <h1>校园AI知识平台</h1>
        <p>多Agent协作 · 混合检索 · 外部工具 · 智能问答</p>
      </div>

      <!-- 错误提示 -->
      <div class="error-msg" id="errorMsg"></div>

      <!-- 按钮（表单在下方隐藏） -->
      <button type="button" class="btn btn-primary login-btn"
              onclick="quickLogin('student','123456')"
              style="font-size:16px;padding:13px;">
        🚀 学生体验
      </button>
      <button type="button" class="btn btn-outline login-btn"
              onclick="quickLogin('admin','admin123')"
              style="margin-top:8px;font-size:16px;padding:13px;">
        🔧 管理后台
      </button>

      <form id="loginForm" style="display:none;">
        <input type="text" id="username">
        <input type="password" id="password">
      </form>
    </div>
  </div>

  <!-- ===== 脚本 ===== -->
  <script src="js/api.js?v=2"></script>
  <script>
    // ========== 主题管理 ==========
    // 页面加载时读取之前保存的主题
    const savedTheme = localStorage.getItem('theme') || 'light'
    document.documentElement.setAttribute('data-theme', savedTheme)
    updateThemeBtn()

    function toggleTheme() {
      const current = document.documentElement.getAttribute('data-theme')
      const next = current === 'dark' ? 'light' : 'dark'
      document.documentElement.setAttribute('data-theme', next)
      localStorage.setItem('theme', next)
      updateThemeBtn()
    }

    function updateThemeBtn() {
      const btn = document.getElementById('themeBtn')
      const theme = document.documentElement.getAttribute('data-theme')
      btn.textContent = theme === 'dark' ? '☀️' : '🌙'
    }

    // ========== 登录逻辑 ==========
    const form = document.getElementById('loginForm')
    const errorMsg = document.getElementById('errorMsg')
    const submitBtn = document.getElementById('submitBtn')

    form.addEventListener('submit', async (e) => {
      e.preventDefault()

      const username = document.getElementById('username').value.trim()
      const password = document.getElementById('password').value.trim()

      if (!username || !password) {
        showError('请填写用户名和密码')
        return
      }

      if (submitBtn) { submitBtn.disabled = true; submitBtn.textContent = '登录中...' }
      errorMsg.style.display = 'none'

      try {
        const res = await apiLogin(username, password)

        if (res.code === 0) {
          localStorage.setItem('token', res.data.token)
          localStorage.setItem('user', JSON.stringify(res.data.user))
          const role = res.data.user.role
          if (role === 'admin') {
            window.location.href = '../admin/index.html'
          } else {
            window.location.href = 'index.html'
          }
        } else {
          showError(res.message || '登录失败，请检查用户名和密码')
        }
      } catch (err) {
        showError('网络异常，请检查后端服务是否启动')
      } finally {
        if (submitBtn) { submitBtn.disabled = false; submitBtn.textContent = '登 录' }
      }
    })

    // 一键快速登录
    async function quickLogin(username, password) {
      document.getElementById('username').value = username
      document.getElementById('password').value = password
      form.dispatchEvent(new Event('submit'))
    }

    function showError(msg) {
      errorMsg.textContent = msg
      errorMsg.style.display = 'block'
    }
  </script>
</body>
</html>
