<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>登录 - 校园AI知识平台</title>
  <link rel="stylesheet" href="css/style.css?_=20250603">
  <style>
    .login-wrapper { display: flex; align-items: center; justify-content: center; min-height: 100vh; background: var(--bg-secondary); padding: 20px; }
    .login-card { width: 100%; max-width: 420px; background: var(--bg); border-radius: var(--radius-lg); box-shadow: var(--shadow-lg); padding: 40px 32px; border: 1px solid var(--border); }
    .login-header { text-align: center; margin-bottom: 32px; }
    .login-logo { width: 64px; height: 64px; background: linear-gradient(135deg, var(--primary), #7c3aed); border-radius: var(--radius-md); display: inline-flex; align-items: center; justify-content: center; font-size: 32px; margin-bottom: 16px; }
    .login-header h1 { font-size: 24px; font-weight: 700; color: var(--text); margin-bottom: 6px; }
    .login-header p { font-size: 14px; color: var(--text-secondary); }
    .form-group { margin-bottom: 20px; }
    .form-group label { display: block; font-size: 13px; font-weight: 500; color: var(--text); margin-bottom: 6px; }
    .form-group input { width: 100%; padding: 12px 16px; border: 1px solid var(--border); border-radius: var(--radius-sm); font-size: 14px; background: var(--bg); color: var(--text); box-sizing: border-box; }
    .login-btn { width: 100%; padding: 13px; font-size: 16px; border-radius: var(--radius-sm); cursor: pointer; border: none; margin-bottom: 8px; font-weight: 600; }
    .btn-primary { background: #3b82f6; color: #fff; }
    .btn-outline { background: #fff; color: #3b82f6; border: 2px solid #3b82f6; }
    .btn-ghost { background: transparent; color: var(--text-secondary); border: 1px solid var(--border); font-size: 13px; padding: 10px; }
    .error-msg { background: #fef2f2; color: #dc2626; padding: 10px 14px; border-radius: var(--radius-sm); font-size: 13px; margin-bottom: 16px; display: none; }
    .divider { text-align: center; margin: 16px 0; color: var(--text-light); font-size: 12px; }
  </style>
</head>
<body>
<div class="login-wrapper">
  <div class="login-card">
    <div class="login-header">
      <div class="login-logo">🤖</div>
      <h1>校园AI知识平台</h1>
      <p>多Agent协作 · 混合检索 · 外部工具 · 智能问答</p>
    </div>
    <div class="error-msg" id="errorMsg"></div>

    <button class="login-btn btn-primary" onclick="doLogin('student','123456')">🚀 学生体验</button>
    <button class="login-btn btn-outline" onclick="doLogin('admin','admin123')">🔧 管理后台</button>
    <div class="divider">或手动输入其他账号</div>
    <div class="form-group"><input type="text" id="username" placeholder="用户名"></div>
    <div class="form-group"><input type="password" id="password" placeholder="密码"></div>
    <button class="login-btn btn-ghost" onclick="doLogin()">登 录</button>
  </div>
</div>

<script>
async function doLogin(u, p) {
  if (!u) { u = document.getElementById('username').value.trim(); p = document.getElementById('password').value.trim() }
  if (!u || !p) { document.getElementById('errorMsg').textContent = '请填写用户名和密码'; document.getElementById('errorMsg').style.display = 'block'; return }

  document.getElementById('errorMsg').style.display = 'none'
  try {
    const r = await fetch('/api/auth/login', {
      method: 'POST', headers: {'Content-Type':'application/json'},
      body: JSON.stringify({username: u, password: p})
    })
    const d = await r.json()
    if (d.code === 0) {
      localStorage.setItem('token', d.data.token)
      localStorage.setItem('user', JSON.stringify(d.data.user))
      window.location.href = d.data.user.role === 'admin' ? '../admin/index.html' : 'index.html'
    } else {
      document.getElementById('errorMsg').textContent = d.message || '登录失败'
      document.getElementById('errorMsg').style.display = 'block'
    }
  } catch(e) {
    document.getElementById('errorMsg').textContent = '网络异常，请检查后端服务'
    document.getElementById('errorMsg').style.display = 'block'
  }
}

document.getElementById('password').addEventListener('keydown', function(e) { if (e.key === 'Enter') doLogin() })
</script>
</body>
</html>
