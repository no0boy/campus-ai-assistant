<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>个人中心 - 校园AI助手</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    /* ===== 页面布局 ===== */
    .page-header {
      background: var(--bg);
      border-bottom: 1px solid var(--border);
      padding: 0 20px;
    }
    .header-inner {
      max-width: 900px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 60px;
    }
    .header-left {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .back-btn {
      background: none;
      border: none;
      font-size: 20px;
      cursor: pointer;
      color: var(--text);
      padding: 4px;
    }
    .header-title {
      font-size: 17px;
      font-weight: 600;
      color: var(--text);
    }

    .page-body {
      max-width: 900px;
      margin: 0 auto;
      padding: 24px 20px;
    }

    /* ===== 用户信息卡片 ===== */
    .profile-card {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 24px;
      display: flex;
      align-items: center;
      gap: 20px;
      margin-bottom: 24px;
    }
    .profile-avatar {
      width: 64px; height: 64px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--primary), #7c3aed);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 28px;
      flex-shrink: 0;
    }
    .profile-info h3 {
      font-size: 18px;
      color: var(--text);
      margin-bottom: 4px;
    }
    .profile-info p {
      font-size: 13px;
      color: var(--text-secondary);
    }
    .profile-info .badge {
      display: inline-block;
      padding: 2px 10px;
      border-radius: var(--radius-full);
      font-size: 11px;
      background: var(--primary-bg);
      color: var(--primary);
      margin-top: 4px;
    }
    .profile-actions {
      margin-left: auto;
      display: flex;
      gap: 8px;
    }

    /* ===== 统计卡片 ===== */
    .stats-row {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      margin-bottom: 24px;
    }
    .stat-card {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 20px;
      text-align: center;
    }
    .stat-num {
      font-size: 28px;
      font-weight: 700;
      color: var(--primary);
      margin-bottom: 4px;
    }
    .stat-label {
      font-size: 13px;
      color: var(--text-secondary);
    }

    /* ===== 标签切换 ===== */
    .tabs {
      display: flex;
      gap: 0;
      border-bottom: 2px solid var(--border);
      margin-bottom: 20px;
    }
    .tab {
      padding: 10px 20px;
      font-size: 14px;
      font-weight: 500;
      color: var(--text-secondary);
      cursor: pointer;
      border-bottom: 2px solid transparent;
      margin-bottom: -2px;
      transition: all var(--transition);
      background: none;
      border-top: none;
      border-left: none;
      border-right: none;
    }
    .tab.active {
      color: var(--primary);
      border-bottom-color: var(--primary);
    }

    /* ===== 对话历史列表 ===== */
    .history-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .history-item {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 16px 20px;
      cursor: pointer;
      transition: all var(--transition);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .history-item:hover {
      border-color: var(--primary);
      box-shadow: var(--shadow-sm);
    }
    .history-item-left {
      flex: 1;
      min-width: 0;
    }
    .history-title {
      font-size: 15px;
      font-weight: 500;
      color: var(--text);
      margin-bottom: 4px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .history-preview {
      font-size: 13px;
      color: var(--text-light);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .history-time {
      font-size: 12px;
      color: var(--text-light);
      flex-shrink: 0;
      margin-left: 16px;
    }
    .history-actions {
      display: flex;
      gap: 4px;
      margin-left: 12px;
    }

    /* ===== 对话详情弹窗 ===== */
    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.5);
      z-index: 100;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }
    .modal-overlay.show { display: flex; }
    .modal {
      background: var(--bg);
      border-radius: var(--radius-lg);
      max-width: 700px;
      width: 100%;
      max-height: 80vh;
      display: flex;
      flex-direction: column;
    }
    .modal-header {
      padding: 16px 20px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .modal-header h3 {
      font-size: 16px;
      color: var(--text);
    }
    .modal-close {
      background: none;
      border: none;
      font-size: 22px;
      cursor: pointer;
      color: var(--text-secondary);
    }
    .modal-body {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
    }
    /* 对话详情里的消息样式 */
    .detail-msg {
      margin-bottom: 20px;
    }
    .detail-msg .role {
      font-size: 12px;
      font-weight: 600;
      margin-bottom: 4px;
      color: var(--text-secondary);
    }
    .detail-msg .content {
      padding: 10px 14px;
      border-radius: var(--radius-sm);
      font-size: 14px;
      line-height: 1.7;
    }
    .detail-msg.user .content {
      background: var(--primary-bg);
      color: var(--text);
    }
    .detail-msg.ai .content {
      background: var(--bg-secondary);
      color: var(--text);
      border: 1px solid var(--border);
    }

    /* ===== 空状态 ===== */
    .empty-state {
      text-align: center;
      padding: 60px 20px;
    }
    .empty-state .icon { font-size: 48px; margin-bottom: 12px; }
    .empty-state p { color: var(--text-secondary); font-size: 14px; }

    /* ===== 搜索框 ===== */
    .search-box {
      margin-bottom: 16px;
    }
    .search-box input {
      width: 100%;
      padding: 10px 16px;
      border: 1px solid var(--border);
      border-radius: var(--radius-full);
      font-size: 14px;
      background: var(--bg-secondary);
      color: var(--text);
      outline: none;
      transition: border var(--transition);
    }
    .search-box input:focus {
      border-color: var(--primary);
    }

    /* ===== 响应式 ===== */
    @media (max-width: 768px) {
      .stats-row { grid-template-columns: repeat(3, 1fr); gap: 8px; }
      .stat-card { padding: 14px 8px; }
      .stat-num { font-size: 22px; }
      .profile-card { flex-wrap: wrap; }
      .profile-actions { margin-left: 0; width: 100%; justify-content: flex-end; }
    }
  </style>
</head>
<body>

  <!-- ==================== 顶部栏 ==================== -->
  <header class="page-header">
    <div class="header-inner">
      <div class="header-left">
        <button class="back-btn" onclick="goBack()" title="返回">←</button>
        <span class="header-title">个人中心</span>
      </div>
      <div style="display:flex;gap:8px;">
        <button class="btn btn-ghost btn-sm" onclick="toggleTheme()">🌙</button>
        <button class="btn btn-outline btn-sm" onclick="logout()">退出</button>
      </div>
    </div>
  </header>

  <div class="page-body">

    <!-- ===== 用户信息卡片 ===== -->
    <div class="profile-card">
      <div class="profile-avatar" id="profileAvatar">U</div>
      <div class="profile-info">
        <h3 id="profileName">用户</h3>
        <p id="profileRole">学生</p>
        <span class="badge">校园 AI 助手用户</span>
      </div>
      <div class="profile-actions">
        <button class="btn btn-outline btn-sm" onclick="exportAll()">📥 导出全部</button>
      </div>
    </div>

    <!-- ===== 统计卡片 ===== -->
    <div class="stats-row">
      <div class="stat-card">
        <div class="stat-num" id="statTotal">0</div>
        <div class="stat-label">总提问次数</div>
      </div>
      <div class="stat-card">
        <div class="stat-num" id="statConversations">0</div>
        <div class="stat-label">对话数量</div>
      </div>
      <div class="stat-card">
        <div class="stat-num" id="statLastActive">-</div>
        <div class="stat-label">最近活跃</div>
      </div>
    </div>

    <!-- ===== 标签切换 ===== -->
    <div class="tabs">
      <button class="tab active" onclick="switchTab('history')">📝 对话历史</button>
      <button class="tab" onclick="switchTab('knowledge')">📚 知识库文档</button>
    </div>

    <!-- ===== 搜索 ===== -->
    <div class="search-box">
      <input type="text" id="searchInput" placeholder="🔍 搜索对话内容..."
             oninput="filterHistory()">
    </div>

    <!-- ===== 对话历史列表 ===== -->
    <div class="history-list" id="historyList">
      <!-- 动态生成 -->
    </div>

    <!-- ===== 知识库文档列表 ===== -->
    <div class="history-list" id="knowledgeList" style="display:none;">
      <!-- 动态生成 -->
    </div>

  </div>

  <!-- ==================== 对话详情弹窗 ==================== -->
  <div class="modal-overlay" id="detailModal" onclick="closeModal(event)">
    <div class="modal" onclick="event.stopPropagation()">
      <div class="modal-header">
        <h3 id="modalTitle">对话详情</h3>
        <button class="modal-close" onclick="closeDetailModal()">✕</button>
      </div>
      <div class="modal-body" id="modalBody">
        <!-- 动态生成 -->
      </div>
    </div>
  </div>

  <!-- ===== 脚本 ===== -->
  <script src="js/api.js?v=3"></script>
  <script src="js/chat.js"></script>
  <script>
    // ========== 初始化 ==========
    document.addEventListener('DOMContentLoaded', () => {
      checkAuth()
      loadProfile()
      loadStats()
      renderHistoryList()
    })

    // 主题初始化
    const savedTheme = localStorage.getItem('theme') || 'light'
    document.documentElement.setAttribute('data-theme', savedTheme)

    // ========== 个人信息 ==========
    function loadProfile() {
      try {
        const user = JSON.parse(localStorage.getItem('user') || '{}')
        document.getElementById('profileName').textContent = user.username || '用户'
        document.getElementById('profileAvatar').textContent = (user.username || 'U')[0].toUpperCase()
        document.getElementById('profileRole').textContent = user.role === 'admin' ? '管理员' : '学生'
      } catch(e) { /* 忽略 */ }
    }

    // ========== 统计数据 ==========
    function loadStats() {
      try {
        const conversations = JSON.parse(localStorage.getItem('conversations') || '[]')
        let totalQuestions = 0
        conversations.forEach(c => {
          totalQuestions += c.messages.filter(m => m.role === 'user').length
        })

        document.getElementById('statTotal').textContent = totalQuestions
        document.getElementById('statConversations').textContent = conversations.length

        // 最近活跃时间
        if (conversations.length > 0) {
          const lastMsg = conversations[0].messages[conversations[0].messages.length - 1]
          const d = new Date()
          document.getElementById('statLastActive').textContent =
            `${d.getMonth()+1}/${d.getDate()} ${d.getHours()}:${String(d.getMinutes()).padStart(2,'0')}`
        }
      } catch(e) {
        document.getElementById('statTotal').textContent = '0'
        document.getElementById('statConversations').textContent = '0'
      }
    }

    // ========== 标签切换 ==========
    function switchTab(tab) {
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'))
      event.target.classList.add('active')

      document.getElementById('historyList').style.display = tab === 'history' ? '' : 'none'
      document.getElementById('knowledgeList').style.display = tab === 'knowledge' ? '' : 'none'

      if (tab === 'knowledge') {
        loadKnowledgeList()
      }
    }

    // ========== 对话历史渲染 ==========
    function renderHistoryList(filter = '') {
      const el = document.getElementById('historyList')
      try {
        const conversations = JSON.parse(localStorage.getItem('conversations') || '[]')

        const filtered = filter
          ? conversations.filter(c =>
              c.title.includes(filter) ||
              c.messages.some(m => m.content.includes(filter))
            )
          : conversations

        if (filtered.length === 0) {
          el.innerHTML = `
            <div class="empty-state">
              <div class="icon">📭</div>
              <p>${filter ? '没有匹配的对话' : '还没有对话记录，去首页开始提问吧！'}</p>
            </div>
          `
          return
        }

        el.innerHTML = filtered.map((c, i) => {
          const lastMsg = c.messages[c.messages.length - 1]
          const preview = lastMsg
            ? (lastMsg.content.length > 50 ? lastMsg.content.slice(0, 50) + '...' : lastMsg.content)
            : ''
          const time = new Date(parseInt(c.id.replace('conv_', '')) || Date.now())
          const timeStr = `${time.getMonth()+1}/${time.getDate()} ${time.getHours()}:${String(time.getMinutes()).padStart(2,'0')}`

          return `
            <div class="history-item" onclick="openDetail('${c.id}')">
              <div class="history-item-left">
                <div class="history-title">${escapeHtml(c.title || '新对话')}</div>
                <div class="history-preview">${escapeHtml(preview)}</div>
              </div>
              <span class="history-time">${timeStr}</span>
              <div class="history-actions" onclick="event.stopPropagation()">
                <button class="btn btn-ghost btn-sm" onclick="exportConversation('${c.id}')" title="导出">📥</button>
                <button class="btn btn-ghost btn-sm" onclick="deleteConversation('${c.id}')" title="删除">🗑️</button>
              </div>
            </div>
          `
        }).join('')
      } catch(e) {
        el.innerHTML = '<div class="empty-state"><div class="icon">📭</div><p>暂无对话记录</p></div>'
      }
    }

    function filterHistory() {
      const keyword = document.getElementById('searchInput').value.trim()
      renderHistoryList(keyword)
    }

    // ========== 对话详情弹窗 ==========
    function openDetail(convId) {
      const conv = (JSON.parse(localStorage.getItem('conversations') || '[]'))
        .find(c => c.id === convId)
      if (!conv) return

      document.getElementById('modalTitle').textContent = conv.title || '对话详情'
      document.getElementById('modalBody').innerHTML = conv.messages.map(m => `
        <div class="detail-msg ${m.role}">
          <div class="role">${m.role === 'user' ? '👤 你' : '🤖 校园 AI 助手'}</div>
          <div class="content">${escapeHtml(m.content)}</div>
        </div>
      `).join('')

      document.getElementById('detailModal').classList.add('show')
    }

    function closeModal(e) {
      if (e.target === e.currentTarget) {
        document.getElementById('detailModal').classList.remove('show')
      }
    }

    function closeDetailModal() {
      document.getElementById('detailModal').classList.remove('show')
    }

    // ========== 导出对话 ==========
    function exportConversation(convId) {
      const conv = (JSON.parse(localStorage.getItem('conversations') || '[]'))
        .find(c => c.id === convId)
      if (!conv) return

      // 生成 Markdown 格式
      let md = `# ${conv.title || '对话记录'}\n\n`
      md += `> 导出时间：${new Date().toLocaleString()}\n\n---\n\n`
      conv.messages.forEach(m => {
        md += `### ${m.role === 'user' ? '👤 提问' : '🤖 AI 回答'}\n\n`
        md += m.content + '\n\n'
      })

      downloadFile(`${conv.title || '对话'}.md`, md)
    }

    function exportAll() {
      const conversations = JSON.parse(localStorage.getItem('conversations') || '[]')
      if (conversations.length === 0) {
        alert('暂无对话可导出')
        return
      }

      let md = `# 校园 AI 助手 - 全部对话记录\n\n`
      md += `> 导出时间：${new Date().toLocaleString()}\n\n---\n\n`

      conversations.forEach((conv, i) => {
        md += `## ${i + 1}. ${conv.title || '对话'}\n\n`
        conv.messages.forEach(m => {
          md += `### ${m.role === 'user' ? '提问' : '回答'}\n\n`
          md += m.content + '\n\n'
        })
        md += '---\n\n'
      })

      downloadFile('全部对话记录.md', md)
    }

    function downloadFile(filename, content) {
      const blob = new Blob([content], { type: 'text/markdown;charset=utf-8' })
      const url = URL.createObjectURL(blob)
      const a = document.createElement('a')
      a.href = url
      a.download = filename
      a.click()
      URL.revokeObjectURL(url)
    }

    // ========== 删除对话 ==========
    function deleteConversation(convId) {
      if (!confirm('确定要删除这条对话吗？')) return

      let conversations = JSON.parse(localStorage.getItem('conversations') || '[]')
      conversations = conversations.filter(c => c.id !== convId)
      localStorage.setItem('conversations', JSON.stringify(conversations))
      renderHistoryList()
      loadStats()
    }

    // ========== 知识库浏览 ==========
    async function loadKnowledgeList() {
      const el = document.getElementById('knowledgeList')
      el.innerHTML = '<div style="text-align:center;padding:20px;color:var(--text-light);">加载中...</div>'

      try {
        const res = await apiGetDocuments()
        if (res.code === 0 && res.data && res.data.length > 0) {
          el.innerHTML = res.data.map(doc => `
            <div class="history-item">
              <div class="history-item-left">
                <div class="history-title">📄 ${escapeHtml(doc.title)}</div>
                <div class="history-preview">类型: ${doc.file_type || '未知'} | 切片数: ${doc.chunk_count || 0}</div>
              </div>
              <span class="history-time">${doc.created_at || ''}</span>
            </div>
          `).join('')
        } else {
          el.innerHTML = '<div class="empty-state"><div class="icon">📚</div><p>暂无知识库文档</p></div>'
        }
      } catch(e) {
        el.innerHTML = '<div class="empty-state"><div class="icon">⚠️</div><p>加载失败，请检查后端服务</p></div>'
      }
    }

    // ========== 工具 ==========
    function goBack() {
      window.location.href = 'index.html'
    }

    function toggleTheme() {
      const current = document.documentElement.getAttribute('data-theme')
      const next = current === 'dark' ? 'light' : 'dark'
      document.documentElement.setAttribute('data-theme', next)
      localStorage.setItem('theme', next)
    }

    function escapeHtml(str) {
      const div = document.createElement('div')
      div.textContent = str
      return div.innerHTML
    }

    function logout() {
      localStorage.removeItem('token')
      localStorage.removeItem('user')
      localStorage.removeItem('conversations')
      window.location.href = 'login.html'
    }
  </script>
</body>
</html>
